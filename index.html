<html>
  <head>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="page column">
    <div class="content column" style="gap: 12px">
      <h1>Will you be my Valentine Koala?</h1>
      <div class="row actions">
        <button id="yes-button" onclick="alert('I love you!💕')">Yes</button>
        <button id="no-button" onclick="alert('Hello')">No</button>
      </div>
    </div>
  </body>
  <script>
    function random(max) {
      return Math.random() * max;
    }

    function runAway() {
      this.style.top = random(document.body.clientHeight - this.clientHeight);
      this.style.left = random(document.body.clientWidth - this.clientWidth);
    }

    function firstHover() {
      this.classList.add("running-away");
      this.removeEventListener("mouseover", firstHover);
      runAway.call(this);
      this.addEventListener("mouseover", runAway);
    }

    function attachListeners() {
      const noButton = document.getElementById("no-button");
      if (noButton) noButton.addEventListener("mouseover", firstHover);
    }

    attachListeners();
  </script>
</html>
